<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>CTF: Analyze Suspicious File | invoice.exe Malware Triage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Fira Code', 'Consolas', system-ui, monospace; }
    body {
      background: linear-gradient(160deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; margin: 0;
    }
    .container {
      max-width: 1200px; width: 100%; background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(28px); border: 1px solid rgba(255, 100, 50, 0.4);
      box-shadow: 0 25px 50px rgba(255, 80, 0, 0.2); border-radius: 2.5rem;
      padding: 2rem; color: #d0d0d0;
    }
    h1 { font-size: 2.2rem; font-weight: 700; text-align: center; background: linear-gradient(135deg, #ff6b35, #ff3300); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.4rem; letter-spacing: 1px; }
    .subtitle { text-align: center; color: #a0a0a0; margin-bottom: 1.8rem; border-bottom: 1px dashed #3a3a3a; padding-bottom: 1rem; font-style: italic; }
    .panel { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(12px); border-radius: 1.8rem; padding: 1.7rem; border: 1px solid #3a3a3a; margin-bottom: 1.8rem; }
    .hidden { display: none !important; }
    input, button { background: #1a1a1a; border: 1px solid #4a4a4a; border-radius: 2rem; padding: 0.7rem 1.3rem; color: #e0e0e0; font-weight: 500; outline: none; font-size: 0.9rem; }
    input:focus { border-color: #ff6b35; box-shadow: 0 0 14px #ff4400; }
    button { background: #2a1a10; border-color: #cc5500; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 0.3rem; }
    button:hover { background: #3a2515; border-color: #ff7730; box-shadow: 0 0 18px #ff5500; }
    .task-card { background: #111111; border-left: 6px solid #ff6b35; padding: 1.2rem; border-radius: 1.3rem; margin: 1.2rem 0; animation: fadeIn 0.35s ease; }
    @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
    .terminal { background: #000000; border: 2px solid #33ff33; border-radius: 1rem; padding: 1rem; margin: 1rem 0; font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.8rem; color: #33ff33; min-height: 200px; max-height: 400px; overflow-y: auto; box-shadow: 0 0 20px rgba(51, 255, 51, 0.2); }
    .terminal .prompt { color: #33ff33; }
    .terminal .command { color: #ffffff; }
    .terminal .output { color: #88ff88; }
    .terminal .highlight { color: #ffff00; background: #333300; padding: 0 4px; }
    .cmd-btn { background: #0a1a0a; border: 1px solid #33ff33; color: #33ff33; font-family: 'Fira Code', monospace; font-size: 0.75rem; padding: 0.4rem 0.8rem; margin: 0.2rem; cursor: pointer; border-radius: 1.5rem; }
    .cmd-btn:hover { background: #1a3a1a; box-shadow: 0 0 10px #33ff33; }
    .log-line { background: #0a0a0a; border: 1px solid #2a2a2a; padding: 0.5rem 1rem; border-radius: 0.6rem; margin: 0.4rem 0; font-family: 'Fira Code', monospace; font-size: 0.78rem; white-space: pre-wrap; color: #c0c0c0; }
    .badge { background: #2a2a2a; padding: 0.2rem 0.9rem; border-radius: 20px; font-size: 0.8rem; }
    .flag-box { background: #1a1a00; border: 2px dashed #ffd700; padding: 0.9rem; border-radius: 20px; text-align: center; font-weight: bold; font-size: 1.4rem; letter-spacing: 3px; color: #ffd700; animation: glowGold 1.7s infinite; }
    @keyframes glowGold { 0% { box-shadow: 0 0 5px #ffd700; } 50% { box-shadow: 0 0 30px #ffaa00; } 100% { box-shadow: 0 0 5px #ffd700; } }
    .vt-result { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 1rem; margin: 0.2rem; font-size: 0.8rem; }
    .vt-malicious { background: #3a1010; border: 1px solid #ff4444; color: #ff6666; }
    .vt-clean { background: #103a10; border: 1px solid #44ff44; color: #66ff66; }
    .sandbox-panel { background: #0a0505; border: 2px solid #ff6600; border-radius: 1rem; padding: 1rem; margin: 1rem 0; }
    .success-msg { color: #9effb7; font-weight: bold; }
    .toast { position: fixed; top: 20px; right: 20px; background: #1a1a1a; border: 1px solid #ff6b35; padding: 1rem 1.5rem; border-radius: 2rem; color: #e0e0e0; font-weight: bold; z-index: 9999; animation: slideIn 0.3s ease, fadeOut 0.3s 2.5s forwards; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    @keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
    code { background: #1a1a1a; padding: 0.2rem 0.6rem; border-radius: 12px; font-family: 'Fira Code', monospace; }
  </style>
</head>
<body>
<div class="container" id="appContainer">

  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <h1>🦠 MALWARE TRIAGE CTF</h1>
    <div class="subtitle">Static & Dynamic Analysis · invoice.exe Investigation</div>
    <div class="panel">
      <div style="text-align:center;">
        <input type="text" id="studentNameInput" placeholder="Enter your name" autocomplete="off" style="width:70%;">
        <input type="password" id="studentPassInput" placeholder="Enter password" style="width:70%; margin-top:0.7rem;">
        <button id="studentSubmitLogin" style="margin-top:0.8rem;">🔐 Enter CTF Lab</button>
        <p style="font-size:0.8rem; color:#a0a0a0; margin-top:0.5rem;">
          Password: <code>45_2026</code>
        </p>
      </div>
    </div>
  </div>

  <!-- STUDENT DASHBOARD -->
  <div id="studentDashboard" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="color:#ff6b35;">👤 <span id="displayStudentName"></span></h2>
      <button id="logoutStudentBtn">🚪 Logout</button>
    </div>
    <div id="taskContainer"></div>
  </div>

</div>

<script>
(function() {
    const FIXED_PASSWORD = '45_2026';
    const STORAGE_KEY = 'malware_ctf_progress';
    
    let currentUser = null;
    let completedTasks = [];

    function loadProgress() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                completedTasks = data.completed || [];
                return data.name;
            }
        } catch(e) {}
        return null;
    }

    function saveProgress() {
        if (currentUser) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                name: currentUser.name,
                completed: currentUser.completedTasks
            }));
        }
    }

    const tasks = [
      { id: 1, title: "🔍 Task 1: VirusTotal Check", desc: "Check MD5 hash on VirusTotal. How many engines detect it as malicious?", answer: "3", extra: "virustotal" },
      { id: 2, title: "📝 Task 2: Strings Analysis", desc: "Use 'strings' command to extract IP address from invoice.exe (format: x.x.x.x)", answer: "192.168.100.50", extra: "strings" },
      { id: 3, title: "📦 Task 3: Packer Detection", desc: "Check entropy. Is the file packed? (yes/no)", answer: "yes", extra: "packer" },
      { id: 4, title: "🏖️ Task 4: Sandbox Analysis", desc: "Run in sandbox. Which registry persistence key does malware create? (exact path)", answer: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\InvoiceHelper", extra: "sandbox" },
      { id: 5, title: "📊 Task 5: Extract IOCs", desc: "List all IOCs found (format: 'IP,hash,filename' without spaces after commas)", answer: "192.168.100.50,d41d8cd98f00b204e9800998ecf8427e,invoice.exe", extra: "iocs" }
    ];

    const fileHash = "d41d8cd98f00b204e9800998ecf8427e";
    const maliciousIP = "192.168.100.50";
    
    const stringsOutput = `
    [Strings output for invoice.exe - 2000+ strings found]
    ...
    !This program cannot be run in DOS mode
    .text .rdata .data .rsrc
    kernel32.dll user32.dll ws2_32.dll
    CreateProcessA VirtualAlloc GetProcAddress LoadLibraryA
    ${maliciousIP}
    /upload.php Mozilla/5.0 POST
    Content-Type: application/octet-stream
    Software\\Microsoft\\Windows\\CurrentVersion\\Run
    InvoiceHelper cmd.exe /c ping
    SeDebugPrivilege OpenProcessToken AdjustTokenPrivileges
    ...`;

    const virusTotalResult = [
      { engine: "Avast", detection: "Win32:Trojan-gen" },
      { engine: "Kaspersky", detection: "Trojan.Win32.Agent" },
      { engine: "Malwarebytes", detection: "Trojan.Downloader" },
      { engine: "ESET", detection: "" },
      { engine: "BitDefender", detection: "" },
      { engine: "Windows Defender", detection: "" },
      { engine: "McAfee", detection: "" }
    ];

    const sandboxResults = {
      processTree: "invoice.exe (PID: 4520) → cmd.exe (PID: 4521) → powershell.exe (PID: 4522)",
      networkConnections: [`TCP ${maliciousIP}:443 (HTTPS)`, "TCP 8.8.8.8:53 (DNS)"],
      registryChanges: [
        "SET: HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run\\InvoiceHelper = C:\\Users\\Victim\\AppData\\Local\\Temp\\invoice.exe"
      ]
    };

    function showToast(message, isError = false) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.background = isError ? '#3a1a1a' : '#1a1a1a';
      toast.style.borderColor = isError ? '#aa3030' : '#ff6b35';
      toast.style.color = isError ? '#ffaaaa' : '#e0e0e0';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
    }

    function createTerminal() {
      let html = '<p style="color:#ff8855; margin-bottom:0.5rem;">💻 Malware Analysis Terminal (click commands):</p>';
      html += '<div style="display:flex; flex-wrap:wrap; gap:0.3rem; margin-bottom:0.5rem;">';
      html += '<button class="cmd-btn" onclick="window.runCmd(\'file invoice.exe\')">file invoice.exe</button>';
      html += '<button class="cmd-btn" onclick="window.runCmd(\'md5sum invoice.exe\')">md5sum</button>';
      html += '<button class="cmd-btn" onclick="window.runCmd(\'strings invoice.exe\')">strings</button>';
      html += '<button class="cmd-btn" onclick="window.runCmd(\'entropy invoice.exe\')">entropy</button>';
      html += '<button class="cmd-btn" onclick="window.runCmd(\'vtcheck invoice.exe\')">vtcheck</button>';
      html += '<button class="cmd-btn" onclick="window.runCmd(\'sandbox invoice.exe\')">sandbox</button>';
      html += '<button class="cmd-btn" onclick="window.runCmd(\'clear\')">clear</button>';
      html += '</div>';
      html += '<div class="terminal" id="terminalOutput">';
      html += '<div><span class="prompt">analyst@triage:~$ </span><span class="command">ready</span></div>';
      html += '<div class="output">Click buttons above to run analysis commands.</div>';
      html += '</div>';
      return html;
    }

    window.runCmd = function(cmd) {
      const terminal = document.getElementById('terminalOutput');
      if (!terminal) return;
      let output = terminal.innerHTML;
      output += `<div><span class="prompt">analyst@triage:~$ </span><span class="command">${cmd}</span></div>`;
      const cl = cmd.toLowerCase().trim();
      
      if (cl === 'clear') {
        terminal.innerHTML = '<div><span class="prompt">analyst@triage:~$ </span><span class="command">clear</span></div>';
        return;
      }
      if (cl.startsWith('file ')) {
        output += '<div class="output">invoice.exe: PE32 executable (GUI) Intel 80386, for MS Windows</div>';
        output += '<div class="output">Compiled: 2024-03-15 14:30:22 | Sections: .text .rdata .data .rsrc</div>';
      } else if (cl.startsWith('md5sum ')) {
        output += `<div class="output">MD5: <span class="highlight">${fileHash}</span></div>`;
      } else if (cl.startsWith('strings ')) {
        output += `<div class="output" style="white-space:pre-wrap;">${stringsOutput}</div>`;
        output += '<div class="output" style="color:#ff8855;">⚠️ Found IP: <span class="highlight">192.168.100.50</span></div>';
      } else if (cl.startsWith('entropy ')) {
        output += '<div class="output">Entropy: .text=7.2 .rdata=6.8 .data=5.1 | Overall: 7.1</div>';
        output += '<div class="output" style="color:#ff4444;">⚠️ HIGH entropy - PACKED executable!</div>';
      } else if (cl.startsWith('vtcheck ')) {
        output += `<div class="output">VirusTotal: MD5 ${fileHash} | Detection: 3/7</div>`;
        virusTotalResult.forEach(r => {
          output += `<div class="output"><span class="vt-result ${r.detection?'vt-malicious':'vt-clean'}">${r.engine}: ${r.detection||'Clean'}</span></div>`;
        });
        output += '<div class="output" style="color:#ff4444;">⚠️ 3 engines detected as MALICIOUS</div>';
      } else if (cl.startsWith('sandbox ')) {
        output += '<div class="output">🏖️ Sandbox Results:</div>';
        output += `<div class="output">Process: ${sandboxResults.processTree}</div>`;
        output += `<div class="output">Network: ${sandboxResults.networkConnections.join(', ')}</div>`;
        output += `<div class="output" style="color:#ff4444;">Registry: ${sandboxResults.registryChanges[0]}</div>`;
        output += '<div class="output" style="color:#ff4444;">⚠️ PERSISTENCE FOUND!</div>';
      } else {
        output += '<div class="output">Commands: file, md5sum, strings, entropy, vtcheck, sandbox, clear</div>';
      }
      terminal.innerHTML = output;
      terminal.scrollTop = terminal.scrollHeight;
    };

    function renderTasks() {
      if (!currentUser) return;
      document.getElementById('displayStudentName').innerText = currentUser.name;
      const container = document.getElementById('taskContainer');
      const completed = currentUser.completedTasks || [];
      
      let html = '<h3 style="margin-bottom:1rem;">🦠 Malware Triage Workstation</h3>';
      html += createTerminal();

      tasks.forEach(task => {
        const done = completed.includes(task.id);
        html += `<div class="task-card" style="border-left-color: ${done ? '#2ecc71' : '#ff6b35'};">`;
        html += `<strong>${task.title}</strong> <span class="badge">${done ? '✅ Complete' : '🔒 Pending'}</span>`;
        html += `<p style="margin:0.4rem 0;">${task.desc}</p>`;

        if (task.extra === 'virustotal') {
          html += `<div class="log-line">MD5: ${fileHash} | Detection: <span style="color:#ff4444;">3/7 malicious</span></div>`;
        } else if (task.extra === 'strings') {
          html += '<div class="log-line">📝 Run "strings invoice.exe" in terminal</div>';
        } else if (task.extra === 'packer') {
          html += '<div class="log-line">📦 Run "entropy invoice.exe" to check packing</div>';
        } else if (task.extra === 'sandbox') {
          html += '<div class="sandbox-panel">';
          html += '<p style="color:#ff8855;">🏖️ Sandbox Results:</p>';
          html += `<p style="font-size:0.8rem;">Process: ${sandboxResults.processTree}</p>`;
          html += `<p style="font-size:0.8rem; color:#ff4444;">Registry: ${sandboxResults.registryChanges[0]}</p>`;
          html += '</div>';
        } else if (task.extra === 'iocs') {
          html += `<div class="log-line">IP: ${maliciousIP} | Hash: ${fileHash} | File: invoice.exe</div>`;
        }

        if (!done) {
          html += `<div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
            <input type="text" id="answerInput${task.id}" placeholder="Your answer" style="flex:1;">
            <button onclick="window.submitTask(${task.id})">✅ Submit</button>
          </div>`;
        } else {
          html += '<p class="success-msg">✔ Task Completed Successfully</p>';
        }
        html += '</div>';
      });

      if (completed.length === tasks.length) {
        html += '<div class="flag-box">🏆 FLAG{INVOICE_EXE_IOCS} 🏆</div>';
        html += '<p style="text-align:center; color:#ffd700;">🎉 Excellent malware triage! All IOCs extracted.</p>';
      }
      
      container.innerHTML = html;
    }

    window.submitTask = function(taskId) {
      if (!currentUser) return;
      const input = document.getElementById(`answerInput${taskId}`);
      if (!input) return;
      const ans = input.value.trim();
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      
      let isCorrect = false;
      if (taskId === 5) {
        const la = ans.toLowerCase();
        isCorrect = la.includes('192.168.100.50') && la.includes('d41d8cd98f00b204e9800998ecf8427e') && la.includes('invoice.exe');
      } else {
        isCorrect = ans.toLowerCase() === task.answer.toLowerCase();
      }
      
      if (isCorrect) {
        if (!currentUser.completedTasks.includes(taskId)) {
          currentUser.completedTasks.push(taskId);
          saveProgress();
        }
        showToast('✅ Correct!');
        renderTasks();
      } else {
        showToast('❌ Incorrect.', true);
        input.style.animation = 'shake 0.5s ease';
        setTimeout(() => { input.style.animation = ''; }, 500);
      }
    };

    function showLogin() {
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('studentDashboard').classList.add('hidden');
      currentUser = null;
    }

    function showStudentDash() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('studentDashboard').classList.remove('hidden');
      renderTasks();
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedName = loadProgress();
      if (savedName) document.getElementById('studentNameInput').value = savedName;
      
      document.getElementById('studentSubmitLogin').addEventListener('click', () => {
        const name = document.getElementById('studentNameInput').value.trim();
        const pass = document.getElementById('studentPassInput').value.trim();
        if (!name || !pass) { showToast('Enter name and password.', true); return; }
        if (pass !== FIXED_PASSWORD) { showToast('Invalid password. Use: 45_2026', true); return; }
        currentUser = { name: name, completedTasks: [...completedTasks] };
        document.getElementById('studentPassInput').value = '';
        showStudentDash();
      });

      document.getElementById('logoutStudentBtn').addEventListener('click', () => {
        showToast('Logged out. Progress saved!');
        showLogin();
      });

      const style = document.createElement('style');
      style.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}';
      document.head.appendChild(style);
      showLogin();
    });
})();
</script>
</body>
</html>
